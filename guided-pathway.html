<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Suspected Acute Stroke — Guided Pathway</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--navy:#1a2744;--navy2:#2c4a7c;--teal:#0e7c7b;--teal-lt:#64d8d8;
--epic:#7c3aed;--epic-bg:#f5f0ff;--ref:#1d4ed8;--ref-bg:#eff5ff;
--doc:#0e7c7b;--doc-bg:#eefaf9;--dispo:#d97706;--dispo-bg:#fff8ed;
--red:#c0392b;--red-bg:#fdf2f2;--green:#1e8449;--green-bg:#f0faf4;
--ink:#22303f;--mute:#6b7a8c;--line:#e2e7ee;--bg:#f4f6fa;--card:#fff;
}
html,body{height:100%}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
#app{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
.topbar{position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(26,39,68,.18)}
.hdr{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:12px 16px}
.hdr-row{display:flex;align-items:center;gap:10px}
.hdr h1{font-size:.95em;font-weight:700;letter-spacing:.2px;flex:1;line-height:1.25}
.hdr h1 small{display:block;font-weight:400;opacity:.7;font-size:.8em;letter-spacing:0}
.clockchip{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:5px 11px;font-size:.7em;font-weight:700;white-space:nowrap;text-align:center;line-height:1.25}
.clockchip b{display:block;font-size:1.3em;color:var(--teal-lt)}
.clockchip.warn{background:rgba(217,119,6,.35);border-color:#f0b357}
.clockchip.warn b{color:#ffd08a}
.clockchip.crit{background:rgba(192,57,43,.45);border-color:#ff8b7d}
.clockchip.crit b{color:#ffc0b8}
.btn-restart{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:6px;padding:6px 9px;font-size:.72em;cursor:pointer;font-family:inherit}
.strip{display:flex;gap:6px;overflow-x:auto;padding:9px 12px;background:#fff;border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip:empty{display:none;padding:0;border:none}
.chip{flex:0 0 auto;background:#f1f4f9;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:.73em;cursor:pointer;font-family:inherit;color:var(--ink);text-align:left;line-height:1.3;transition:.12s}
.chip:hover{background:#e6ecf6;border-color:#c3cfe0}
.chip span{display:block;font-size:.82em;color:var(--mute);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.chip b{font-weight:700}
.chip.pos b{color:var(--red)}.chip.neg b{color:var(--green)}
main{flex:1;padding:14px 12px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(26,39,68,.05)}
.eyebrow{font-size:.68em;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--mute);margin-bottom:5px}
.q{font-size:1.2em;font-weight:700;color:var(--navy);line-height:1.3;margin-bottom:3px}
.sub{color:var(--mute);font-size:.85em;margin-bottom:13px}
.card p{font-size:.9em;margin-bottom:9px}
.card p:last-child{margin-bottom:0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;font-size:.94em;font-family:inherit;color:var(--ink);cursor:pointer;transition:.12s;font-weight:600}
.opt:hover{border-color:var(--navy2);background:#f7f9fd}
.opt .ic{width:30px;height:30px;flex:0 0 30px;border-radius:8px;display:grid;place-items:center;font-size:.85em;font-weight:800;background:#eef2f8;color:var(--navy)}
.opt small{display:block;font-weight:400;font-size:.78em;color:var(--mute);margin-top:1px;line-height:1.35}
.opt.sel{border-color:var(--navy);background:#f0f4fb;box-shadow:inset 0 0 0 1px var(--navy)}
.opt.pos .ic{background:var(--red-bg);color:var(--red)}
.opt.neg .ic{background:var(--green-bg);color:var(--green)}
.opt.unc .ic{background:#fff5e6;color:var(--dispo)}
.opt.pos.sel{border-color:var(--red);background:var(--red-bg);box-shadow:inset 0 0 0 1px var(--red)}
.opt.neg.sel{border-color:var(--green);background:var(--green-bg);box-shadow:inset 0 0 0 1px var(--green)}
.opt.unc.sel{border-color:var(--dispo);background:var(--dispo-bg);box-shadow:inset 0 0 0 1px var(--dispo)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.row3 .opt,.row2 .opt{justify-content:center;text-align:center;padding:12px 6px;font-size:.88em}
.row3 .opt .ic,.row2 .opt .ic{display:none}
.lk{display:inline-flex;align-items:center;gap:6px;border:1px solid;border-radius:7px;padding:5px 10px;font-size:.83em;font-weight:600;cursor:pointer;font-family:inherit;margin:3px 5px 3px 0;text-align:left;line-height:1.3}
.lk::before{content:'';width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.lk-epic{color:var(--epic);background:var(--epic-bg);border-color:#d9c8ff}
.lk-epic::before{background:var(--epic)}
.lk-ref{color:var(--ref);background:var(--ref-bg);border-color:#c3d8fb}
.lk-ref::before{background:var(--ref)}
.lk-doc{color:var(--doc);background:var(--doc-bg);border-color:#b9e2e0}
.lk-doc::before{background:var(--doc)}
.lk:hover{filter:brightness(.95)}
.verdict{border-radius:12px;padding:18px 16px;margin-bottom:12px;border:2px solid;text-align:center}
.verdict .vt{font-size:.68em;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;opacity:.75}
.verdict .vh{font-size:1.5em;font-weight:800;margin:3px 0 6px;line-height:1.15}
.verdict .vw{font-size:.86em;line-height:1.45}
.v-code{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.v-ne{background:#fffbeb;border-color:#d9a406;color:#8a6100}
.v-out{background:var(--dispo-bg);border-color:var(--dispo);color:#9a5b06}
.v-ok{background:var(--green-bg);border-color:var(--green);color:#166534}
.note{background:#f7f9fc;border-left:3px solid var(--navy2);border-radius:0 7px 7px 0;padding:10px 12px;font-size:.84em;margin:10px 0;color:#3d4d60}
.note.chg{background:var(--dispo-bg);border-left-color:var(--dispo);color:#8a5406;font-weight:600}
.note.crit{background:var(--red-bg);border-left-color:var(--red);color:#8c2b20;font-weight:600}
.lbl{font-size:.72em;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--mute);margin:15px 0 6px}
ul.tight{padding-left:19px;font-size:.88em}
ul.tight li{margin:4px 0}
input[type=text],input[type=time],input[type=date],input[type=number]{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:9px;font-size:1em;font-family:inherit;color:var(--ink);background:#fff}
input:focus{outline:none;border-color:var(--navy2)}
.chk{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border:1.5px solid var(--line);border-radius:9px;cursor:pointer;font-size:.88em;margin-bottom:7px;background:#fff;transition:.12s}
.chk:hover{background:#f7f9fd}
.chk input{margin-top:2px;accent-color:var(--teal);width:17px;height:17px;flex:0 0 17px}
.chk.on{border-color:var(--teal);background:var(--doc-bg)}
.tz{flex:0 0 auto;background:#eef2f8;border:1.5px solid var(--line);border-radius:9px;padding:11px 12px;font-size:.85em;font-weight:700;color:#42546b;letter-spacing:.5px}
.nav{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;padding:13px;border-radius:10px;border:none;font-size:.95em;font-weight:700;font-family:inherit;cursor:pointer;transition:.12s}
.btn-p{background:var(--navy);color:#fff}.btn-p:hover{background:var(--navy2)}
.btn-p:disabled{background:#c3cbd8;cursor:not-allowed}
.btn-s{background:#fff;border:1.5px solid var(--line);color:var(--mute);flex:0 0 auto;padding:13px 18px}
.btn-s:hover{background:#f1f4f9;color:var(--ink)}
table.t{width:100%;border-collapse:collapse;font-size:.82em;margin:8px 0}
table.t th{background:var(--navy);color:#fff;padding:8px 9px;text-align:left;font-weight:600}
table.t td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr.hit td{background:var(--red-bg);font-weight:700}
.mask{position:fixed;inset:0;background:rgba(20,28,42,.55);z-index:100;display:none;align-items:flex-end;justify-content:center}
.mask.on{display:flex}
.sheet{background:#fff;width:100%;max-width:760px;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
.sheet h3{font-size:1.1em;color:var(--navy);margin-bottom:4px}
.sheet .sh-sub{font-size:.83em;color:var(--mute);margin-bottom:12px}
@media(min-width:600px){.mask{align-items:center}.sheet{border-radius:16px;max-height:86vh}}
.ntot{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:10px;padding:13px 15px;display:flex;align-items:center;gap:16px;margin-bottom:12px;position:sticky;top:-18px;z-index:5}
.ntot .n{font-size:2.3em;font-weight:800;color:var(--teal-lt);line-height:1}
.ntot .sv{padding:4px 12px;border-radius:999px;font-weight:700;font-size:.78em}
.ni{border:1px solid var(--line);border-radius:9px;margin-bottom:8px;overflow:hidden}
.nih{background:#f4f6fa;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;font-size:.85em;font-weight:700;cursor:pointer;gap:8px;color:var(--navy)}
.nib{background:var(--teal);color:#fff;border-radius:5px;padding:1px 9px;font-size:.9em;min-width:26px;text-align:center}
.nib.hi{background:var(--red)}
.nio{padding:6px 10px;background:#fff;border-top:1px solid var(--line)}
.nio.hide{display:none}
.nio label{display:flex;gap:9px;padding:7px 6px;border-radius:6px;cursor:pointer;font-size:.83em;align-items:flex-start}
.nio label:hover{background:#f2f6fc}
.nio input{accent-color:var(--teal);margin-top:2px;flex:0 0 auto}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.footer{text-align:center;font-size:.72em;color:var(--mute);padding:4px 12px 22px;line-height:1.5}
.sumbox{background:#f7f9fc;border:1px solid var(--line);border-radius:9px;padding:12px;font-size:.82em;white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;line-height:1.55;max-height:340px;overflow:auto}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
  <div class="hdr">
    <div class="hdr-row">
      <h1>Suspected Acute Stroke<small>Guided pathway — prototype</small></h1>
      <div class="clockchip" id="clk" style="display:none"></div>
      <button class="btn-restart" onclick="restart()">&#8635; New</button>
    </div>
  </div>
  <div class="strip" id="strip"></div>
  </div>
  <main id="main"></main>
  <div class="footer">Prototype for pathway-design discussion. Not a validated clinical decision tool. Content transcribed from the existing Epic <i>Suspected Acute Stroke SE</i> pathway.</div>
</div>
<div class="mask" id="mask" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
<script>
/* ============ STATE ============ */
var S, hist, step, ticker;
function blank(){return{
 lkwMode:null,lkwDate:'',lkwTime:'',lkwTimeRaw:'',lkwUnknown:false,
 befast:null,lvo:null,bao:null,disabling:null,resolved:false,otherCause:false,
 weight:'',glucose:'',nihss:null,nihssFinal:null,nihssScores:{},
 mrs:null,ct:null,mimic:false,cxReviewed:false,discPt:false,discTeam:false,
 lyticsGiven:false,mtDone:false,extGiven:false,dispo:null,lastVerdict:null,changeNote:null
};}
function restart(){if(step&&step!=='intro'&&!confirm('Start a new patient? Current entries are cleared.'))return;S=blank();hist=[];step='intro';render();}

/* ============ LKW MATH ============ */
function lkwDT(){
 if(S.lkwUnknown||!S.lkwDate||!S.lkwTime)return null;
 var d=new Date(S.lkwDate+'T'+S.lkwTime);return isNaN(d)?null:d;
}
function lkw(){
 if(S.lkwUnknown)return{set:true,unknown:true,bucket:'unknown',label:'Unknown',hours:null};
 var d=lkwDT();
 if(!d)return{set:false,unknown:false,bucket:null,label:'Not set',hours:null};
 var h=(Date.now()-d.getTime())/3600000;
 var b=h<0?'future':h<4.5?'lt45':h<24?'mid':'over24';
 return{set:true,unknown:false,bucket:b,hours:h,date:d,
  label:h<0?'in the future':fmtH(h)+' ago',
  remain:4.5-h};
}
function fmtH(h){var m=Math.round(h*60);return (m<60)?m+' min':Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m';}
function bucketName(b){return{lt45:'< 4.5 hours',mid:'4.5 – 24 hours',over24:'> 24 hours',unknown:'Unknown',future:'invalid'}[b]||'—';}

function tick(){
 var c=document.getElementById('clk'),L=lkw();
 if(!L.set||step==='intro'){c.style.display='none';return;}
 c.style.display='';c.className='clockchip';
 if(L.unknown){c.innerHTML='LKW<b>Unknown</b>';c.classList.add('warn');return;}
 if(L.bucket==='over24'){c.innerHTML='SINCE LKW<b>'+Math.floor(L.hours)+'h</b>';c.classList.add('warn');return;}
 if(L.bucket==='future'){c.innerHTML='LKW<b>future</b>';c.classList.add('crit');return;}
 if(L.remain>0){
  c.innerHTML='LEFT IN 4.5h WINDOW<b>'+fmtH(L.remain)+'</b>';
  if(L.remain<1)c.classList.add('crit');else if(L.remain<2)c.classList.add('warn');
 }else{
  c.innerHTML='PAST 4.5h BY<b>'+fmtH(-L.remain)+'</b>';c.classList.add('warn');
 }
}

/* ============ ROUTING ============ */
function route(){
 var L=lkw();
 if(S.otherCause)return'OUT';
 if(S.resolved)return'NE';
 if(L.bucket==='over24')return'NE';
 var anyPos=S.befast==='pos'||S.lvo==='pos'||S.bao==='pos';
 var gaps=(S.lvo===null||S.bao===null||S.disabling===null);
 if(L.bucket==='lt45'){
  if(anyPos||S.disabling===true)return'CODE';
  if(gaps)return'INCOMPLETE';
  return'OUT';
 }
 if(S.lvo==='pos'||S.bao==='pos'||S.disabling===true)return'CODE';
 if(gaps)return'INCOMPLETE';
 if(!anyPos)return'OUT';
 return'NE';
}
function ctaOrder(){return S.lvo==='pos'||S.bao==='pos'||S.disabling;}

/* ============ NAV ============ */
function go(n){if(step!==n){hist.push(step);step=n;}render();window.scrollTo(0,0);}
function back(){if(hist.length){step=hist.pop();render();window.scrollTo(0,0);}}
function jump(n){ /* edit an earlier answer, remembering where we were */
 if(step!==n){hist.push(step);step=n;}
 S.lastVerdict=S.lastVerdict; render();window.scrollTo(0,0);
}
function set(k,v,next){S[k]=v;if(next)go(next);else render();}

/* ============ PATIENT STRIP ============ */
function strip(){
 if(step==='intro')return'';
 var L=lkw(),h='';
 function chip(lbl,val,cls,tgt){return '<button class="chip '+(cls||'')+'" onclick="jump(\''+tgt+'\')"><span>'+lbl+'</span><b>'+val+'</b></button>';}
 if(L.set)h+=chip('LKW',L.unknown?'Unknown':bucketName(L.bucket),L.bucket==='lt45'?'pos':'','lkw');
 if(S.befast)h+=chip('BE-FAST',{pos:'POS',neg:'NEG',uncertain:'Uncertain'}[S.befast],S.befast==='pos'?'pos':S.befast==='neg'?'neg':'','screen');
 if(S.lvo)h+=chip('LVO / FANG-D',S.lvo==='pos'?'POS':'NEG',S.lvo==='pos'?'pos':'neg','screen');
 if(S.bao)h+=chip('BAO',S.bao==='pos'?'POS':'NEG',S.bao==='pos'?'pos':'neg','screen');
 if(S.disabling!==null)h+=chip('Disabling sx',S.disabling?'Yes':'No',S.disabling?'pos':'neg','screen');
 if(S.nihss!==null)h+=chip('NIHSS',String(S.nihss),S.nihss>=6?'pos':'','manage');
 if(S.mrs!==null)h+=chip('Pre-stroke mRS',String(S.mrs),S.mrs>=3?'pos':'neg','manage');
 if(S.ct)h+=chip('CT',{ischemic:'Ischemic / unremarkable',hemorrhagic:'Hemorrhagic'}[S.ct],S.ct==='hemorrhagic'?'pos':'','ct');
 return h;
}
/* ============ SHEETS / REFERENCE CONTENT ============ */
function openSheet(html){document.getElementById('sheet').innerHTML=html+'<div class="nav"><button class="btn btn-p" onclick="closeSheet()">Close</button></div>';document.getElementById('mask').classList.add('on');}
function closeSheet(){document.getElementById('mask').classList.remove('on');render();}
function epic(name){openSheet('<h3 style="color:var(--epic)">'+name+'</h3><div class="sh-sub">Epic-native item</div>'+
 '<div class="note">In Epic this link opens <b>'+name+'</b> directly. This prototype cannot open Epic, so the item is flagged purple: <b>if this pathway is adopted, this is one of the links the build team needs to wire.</b></div>');}

var REF={
 befast:['BE-FAST screen','<ul class="tight"><li><b>B</b> — Loss of <b>B</b>alance</li><li><b>E</b> — <b>E</b>ye / vision changes</li><li><b>F</b> — <b>F</b>ace drooping</li><li><b>A</b> — <b>A</b>rm weakness</li><li><b>S</b> — <b>S</b>peech difficulty</li><li><b>T</b> — <b>T</b>hunderclap headache</li></ul><div class="note">Screen is <b>positive</b> if any element is present and not explained by an obvious non-stroke cause.</div>'],
 fangd:['LVO screen — FANG-D','<ul class="tight"><li><b>F</b> — <b>F</b>ield cut, visual</li><li><b>A</b> — <b>A</b>phasia</li><li><b>N</b> — <b>N</b>eglect</li><li><b>G</b> — <b>G</b>aze preference</li><li><b>D</b> — <b>D</b>ense limb weakness</li></ul>'],
 bao:['BAO screen','<ul class="tight"><li>Sudden, unexplained comatose-like state</li></ul>'],
 disabling:['Disabling symptoms','<p>Deficits that would prevent the patient returning to their baseline work or activities of daily living if they did not resolve — e.g. dense hemiparesis, aphasia, hemianopia, gaze deviation, severe dysarthria, ataxia limiting ambulation.</p><div class="note">This determines Code Stroke activation in the <b>4.5 – 24 hour</b> window, and is one of the criteria for extended-window thrombolytics.</div>'],
 narrator:['Stroke Narrator','<p>Nursing documentation activity for a Code Stroke — captures the timeline, serial neuro assessments and time stamps used for stroke-centre metrics.</p><div class="note">Epic-native activity. Blue here because the equivalent could also live in-app; confirm with the Epic team which side it belongs on.</div>'],
 cx:['Relative and absolute contraindications to thrombolytics','<div class="lbl">Absolute</div><ul class="tight"><li>CT with extensive hypodensity responsible for symptoms</li><li>CT with acute intracranial hemorrhage</li><li>Moderate–severe TBI &lt; 14 days</li><li>Intracranial / spinal neurosurgery &lt; 14 days</li><li>Acute spinal cord injury &lt; 3 months</li><li>Intra-axial intracranial neoplasm</li><li>Active infective endocarditis</li><li>Severe coagulopathy / thrombocytopenia (PLT &lt; 100K, INR &gt; 1.7, aPTT &gt; 40s, PT &gt; 15s)</li><li>Known or suspected aortic arch dissection</li><li>Amyloid-related imaging abnormalities (ARIA) / amyloid immunotherapy</li></ul><div class="lbl">Relative — individualised risk / benefit</div><ul class="tight"><li>Pre-existing disability or frailty</li><li>DOAC exposure &lt; 48 h</li><li>Ischemic stroke &lt; 3 months; prior ICH</li><li>Major non-CNS trauma 14 d – 3 mo; major non-CNS surgery &lt; 10 d</li><li>GI / GU bleeding &lt; 21 days</li><li>Intracranial arterial dissection or vascular malformation</li><li>STEMI &lt; 3 months; acute pericarditis; LA / LV thrombus</li><li>Systemic active malignancy</li><li>Pregnancy and post-partum</li><li>Dural puncture &lt; 7 d; arterial puncture at noncompressible site &lt; 7 d</li></ul><div class="note"><b>Key principle:</b> weigh the severity and disability of the presenting stroke against bleeding risk. For severe, clearly disabling deficits, IVT benefit generally outweighs risk. Consult stroke neurology.</div><div class="note">Full detail lives in the Acute Stroke Management Guide → <i>TNK Contraindications</i>.</div>'],
 ext:['Extended window imaging and thrombolytic criteria','<ul class="tight"><li>LKW <b>4.5 – 24 hours</b></li><li><b>ONLY</b> in consultation with Neurology</li><li><b>ONLY</b> if thrombolytics were <b>not already given</b></li><li><b>ONLY</b> if mechanical thrombectomy was <b>not performed</b></li><li>NIHSS &ge; 6 and/or disabling symptoms</li><li>Perfusion / advanced imaging supporting salvageable tissue</li><li>Recommended by Neurology</li></ul><div class="note">Trial-level detail (OPTION, HOPE / TRACE) is in the Acute Stroke Management Guide → <i>Extended TNK</i> sections.</div>'],
 nihss6:['NIHSS 6 and/or disabling symptoms','<p>One of the entry criteria for extended-window thrombolytics: NIHSS &ge; 6, <i>or</i> a deficit that is clearly disabling regardless of the numeric score.</p><div class="note">Current documented NIHSS: <b>'+'</b></div>'],
 mt:['Mechanical thrombectomy criteria','<ul class="tight"><li>Anterior circulation LVO: <b>ICA or proximal MCA</b></li><li>By LKW: <b>&lt; 6 h</b> ideal · <b>&lt; 16 h</b> reasonable · <b>&lt; 24 h</b> <i>and</i> perfusion mismatch on CT</li></ul>'],
 why:['Why use this pathway?','<table class="t"><tr><th>Pages</th><th>Inclusion criteria</th></tr><tr><td>Screen<br>Manage</td><td>Stroke-like symptoms<br>Age &ge; 18 years<br>Last known well &lt; 24 hours</td></tr></table><div class="note">CT time goals: <b>initiated &le; 20 min</b>, <b>interpreted &le; 35 min</b>.</div>'],

['4','Facial Palsy',['Normal symmetrical movements','Minor paralysis (flattened NLF, asymmetry on smiling)','Partial paralysis (total or near-total paralysis of lower face)','Complete paralysis of one or both sides (upper and lower face)']],

function nihssOpen(final){
 nFinalMode=!!final;nTmp={};var src=final?(S.nihssFinalScores||{}):S.nihssScores;
 NI.forEach(function(i){nTmp[i[0]]=src[i[0]]||0;});
 var h='<h3 style="color:var(--doc)">Document NIHSS'+(final?' — final, at dispo':'')+'</h3><div class="sh-sub">Scored in-app. The total drops straight into the Review row and the patient strip.</div>';
 h+='<div class="ntot"><div><div style="font-size:.7em;opacity:.8">TOTAL</div><div class="n" id="ntot">0</div></div><div><div style="font-size:.7em;opacity:.8;margin-bottom:3px">Severity</div><div class="sv" id="nsev"></div></div></div><div id="nlist"></div>';
 h+='<div class="nav"><button class="btn btn-s" onclick="closeSheet()">Cancel</button><button class="btn btn-p" onclick="nihssSave()">Save score</button></div>';
 document.getElementById('sheet').innerHTML=h;
 var L='';NI.forEach(function(it,ix){
  L+='<div class="ni"><div class="nih" onclick="nihToggle('+ix+')"><span>'+it[0]+'. '+it[1]+'</span><span class="nib" id="nb'+ix+'">0</span></div><div class="nio hide" id="no'+ix+'">';
  it[2].forEach(function(o,v){L+='<label><input type="radio" name="ni'+ix+'" value="'+v+'" onchange="nihSet('+ix+','+v+')"'+(nTmp[it[0]]===v?' checked':'')+'><span><b>'+v+'</b> — '+o+'</span></label>';});
  L+='</div></div>';});
 document.getElementById('nlist').innerHTML=L;
 nihUpd();document.getElementById('mask').classList.add('on');

function nihToggle(ix){document.getElementById('no'+ix).classList.toggle('hide');}
function nihSet(ix,v){nTmp[NI[ix][0]]=v;nihUpd();document.getElementById('no'+ix).classList.add('hide');}
function nihTotal(){var t=0;NI.forEach(function(i){t+=nTmp[i[0]]||0;});return t;}
function sev(t){return t===0?['No stroke symptoms','#1e8449']:t<=4?['Minor (1–4)','#2ecc71']:t<=15?['Moderate (5–15)','#f39c12']:t<=20?['Moderate–severe (16–20)','#e67e22']:['Severe (21–42)','#c0392b'];}
function nihUpd(){
 var t=nihTotal();document.getElementById('ntot').textContent=t;

 NI.forEach(function(i,ix){var b=document.getElementById('nb'+ix);b.textContent=nTmp[i[0]]||0;b.className='nib'+((nTmp[i[0]]||0)>0?' hi':'');});
}
function nihssSave(){
 var t=nihTotal();
 if(nFinalMode){S.nihssFinal=t;S.nihssFinalScores=JSON.parse(JSON.stringify(nTmp));}
 else{S.nihss=t;S.nihssScores=JSON.parse(JSON.stringify(nTmp));}

}

V.lkw=function(){
 var L=lkw(),t=new Date(),y=new Date(Date.now()-86400000);
 function ds(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
 var td=ds(t),yd=ds(y);
 var h='<div class="card"><div class="eyebrow">Step 1 of 3 &nbsp;&middot;&nbsp; anyone on the team</div><div class="q">Last known well</div>'+
 '<div class="sub">When was the patient last seen at their baseline?</div>'+
 '<div class="row3" style="margin-bottom:10px">'+
  opt('Today','','', "setDay('"+td+"')", S.lkwDate===td&&!S.lkwUnknown)+

  opt('Unknown','','', "setUnknown()", S.lkwUnknown)+'</div>';
 if(!S.lkwUnknown){
  var bad=S.lkwTimeRaw&&!S.lkwTime;

   '<div style="display:flex;gap:8px;align-items:center">'+
   '<input type="text" id="lkwt" inputmode="numeric" autocomplete="off" maxlength="5" placeholder="HH:MM" value="'+S.lkwTimeRaw+'"'+
   (bad?' style="border-color:var(--red);background:var(--red-bg)"':'')+' oninput="timeIn(this)">'+
   '<span class="tz">'+tzAbbr()+'</span>'+
   '<button class="btn btn-s" style="flex:0 0 auto;padding:11px 14px" onclick="setNow()">Now</button></div>'+
   (bad?'<div style="font-size:.78em;color:var(--red);margin-top:5px;font-weight:600">Enter a 24-hour time between 00:00 and 23:59 &mdash; e.g. 13:30 for 1:30 pm.</div>'
       :'<div style="font-size:.76em;color:var(--mute);margin-top:5px">Type the digits &mdash; 1330 becomes 13:30.</div>');

 }
 if(L.set){

  var msg=L.unknown?'Treated as the 4.5 &ndash; 24 hour window until it is established. Screens still decide activation.'

  h+='<div class="verdict '+cls+'" style="margin-top:14px"><div class="vt">LKW</div><div class="vh">'+
   (L.unknown?'Unknown':bucketName(L.bucket))+'</div><div class="vw">'+(L.unknown?'':'<b>'+L.label+'</b><br>')+msg+'</div></div>';
 }
 h+=navBtns('Continue &rarr;',"go('screen')",L.set&&L.bucket!=='future')+'</div>'+shortcut();

};
function tzAbbr(){
 try{var p=new Date().toLocaleTimeString('en-US',{timeZoneName:'short'}).split(' ');
  var a=p[p.length-1];return /^[A-Z]{2,5}$/.test(a)?a:'EDT';}catch(e){return 'EDT';}
}
function fmtTime(v){
 v=v.replace(/[^0-9]/g,'').slice(0,4);
 return v.length>2?v.slice(0,2)+':'+v.slice(2):v;
}
function timeIn(el){
 var v=fmtTime(el.value);
 S.lkwTimeRaw=v;
 S.lkwTime=/^([01][0-9]|2[0-3]):[0-5][0-9]$/.test(v)?v:'';

 var n=document.getElementById('lkwt');
 if(n){n.focus();try{n.setSelectionRange(v.length,v.length);}catch(e){}}

function setTime(t){S.lkwTime=t;S.lkwTimeRaw=t;}
function setDay(d){S.lkwDate=d;S.lkwUnknown=false;if(!S.lkwTime){var n=new Date();setTime(String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'));}render();}
function setUnknown(){S.lkwUnknown=true;render();}
function setNow(){var n=new Date();setTime(String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'));if(!S.lkwDate){S.lkwDate=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');}S.lkwUnknown=false;render();}

 if(r==='OUT'){

   ' This patient does not enter the acute stroke pathway.</div></div>'+

  return h;
 }
 if(r==='NE'){

function vName(r){return{CODE:'Code Stroke',NE:'Non-emergent workup',OUT:'Outside pathway',INCOMPLETE:'undecided'}[r]||r;}
function neWhy(){
 var L=lkw();
 if(S.resolved)return'Symptoms have resolved.';
 if(L.bucket==='over24')return'Last known well is more than 24 hours ago ('+L.label+').';
 return'LKW is in the 4.5 &ndash; 24 hour window with <b>no LVO, no BAO and no disabling symptoms</b>.';
}
function codeWhy(){
 var L=lkw(),bits=[];
 if(S.befast==='pos')bits.push('BE-FAST positive');
 if(S.lvo==='pos')bits.push('LVO (FANG-D) positive');
 if(S.bao==='pos')bits.push('BAO positive');

}
function actTable(){
 var L=lkw(),m=L.bucket==='mid'||L.bucket==='unknown';
 function row(lbl,a,b,hitA,hitB){return '<tr class="'+((L.bucket==='lt45'&&hitA)||(m&&hitB)?'hit':'')+'"><td>'+lbl+'</td><td>'+a+'</td><td>'+b+'</td></tr>';}
 return '<table class="t"><tr><th></th><th>LKW &lt; 4.5 h</th><th>LKW 4.5 &ndash; 24 h</th></tr>'+
  row('BE-FAST positive','Code Stroke','&mdash;',S.befast==='pos',false)+
  row('Disabling symptoms','Code Stroke','Code Stroke',S.disabling===true,S.disabling===true)+
  row('LVO positive','Code Stroke','Code Stroke',S.lvo==='pos',S.lvo==='pos')+
  row('BAO positive','Code Stroke','Code Stroke',S.bao==='pos',S.bao==='pos')+
  '</table><div style="font-size:.76em;color:var(--mute)">Highlighted row(s) = what applies to this patient.</div>';
}
V.code=function(){

function imagingRec(){
 var L=lkw(), hit=ctaOrder(), r={};
 var trig=[]; if(S.lvo==='pos')trig.push('LVO (FANG-D) positive'); if(S.bao==='pos')trig.push('BAO positive'); if(S.disabling===true)trig.push('disabling symptoms');
 if(L.bucket==='over24'){
  r.order='Non-emergent brain imaging';
  r.detail='CT head W/O &plusmn; CTA H&amp;N';
  r.ctp=false; r.row='&gt; 24 hours &middot; any screen';
  r.why='Beyond 24 hours there is no role for CT perfusion.';
 }else if(hit){
  r.order='CT Code Stroke WITH Perfusion';
  r.detail='NCCT + CTA H&amp;N + CTP';
  r.ctp=true; r.row=(L.bucket==='lt45'?'&lt; 4.5 hours':'4.5 &ndash; 24 hours')+' &middot; '+
   (S.lvo==='pos'?'LVO positive':'BAO / disabling &mdash; same perfusion row as LVO positive');
  r.why=trig.join(', ')+' &mdash; perfusion imaging is needed to assess thrombectomy candidacy.';
 }else if(L.bucket==='lt45'){
  r.order='CT Code Stroke Head W/O only';
  r.detail='NCCT &mdash; in select cases may add CTA H&amp;N';
  r.ctp=false; r.row='&lt; 4.5 hours &middot; LVO negative';
  r.why='LVO and BAO screens negative and symptoms not disabling &mdash; non-contrast CT is enough to decide on thrombolytics.';
 }else{
  r.order='Non-emergent imaging';
  r.detail='CT head W/O &plusmn; CTA H&amp;N &mdash; no CTP';
  r.ctp=false; r.row='4.5 &ndash; 24 hours &middot; LVO negative';
  r.why='Outside the thrombolytic window with no LVO, BAO or disabling symptoms &mdash; there is no perfusion decision to make.';
 }
 r.avail=r.ctp;
 return r;
}

 if(S.mrs!==null)o.push('Pre-stroke mRS  : '+S.mrs+'  ('+MRSL[S.mrs]+')');
 if(S.nihssFinal!==null)o.push('NIHSS (final)   : '+S.nihssFinal+'  ('+sev(S.nihssFinal)[0]+')');
 o.push('Imaging called  : '+imagingRec().order.replace(/&[a-z]+;/g,''));
 if(S.ct)o.push('CT result       : '+{ischemic:'Ischemic / unremarkable (no haemorrhage)',hemorrhagic:'Hemorrhagic stroke'}[S.ct]);
 if(S.ct==='ischemic'){
  o.push('Thrombolytics   : '+(S.lyticsGiven?'YES — Code Stroke Tenecteplase orders':S.extGiven?'YES — extended window, with Neurology':'No'));
  o.push('Thrombectomy    : '+(S.mtDone?'YES — coordinated with Neurology':'No'));
  if(S.cxReviewed)o.push('                  Contraindications reviewed');
  if(S.discPt||S.discTeam)o.push('                  Risks/benefits discussed with '+[S.discPt?'patient/family':'',S.discTeam?'medical team':''].filter(Boolean).join(' and '));
 }
 o.push('Disposition     : '+({discharge:'Discharge',admit:'Admit (in-house)'+((S.lyticsGiven||S.mtDone||S.extGiven)?' — Neuro ICU':''),transfer:'Transfer to stroke centre','admit-ne':'Admit — non-emergent stroke workup','admit-ich':'Admit — hemorrhagic stroke workup','transfer-ich':'Transfer — hemorrhagic stroke workup','non-stroke':'Dispo for non-stroke etiology'}[S.dispo]||'not set'));
 o.push('');
 o.push('Generated by the guided pathway prototype — not a validated clinical record.');
 return o.join('\n');
}
V.summary=function(){
 var d=S.dispo||'', ok=['discharge','admit','transfer','admit-ne','admit-ich','transfer-ich'].indexOf(d)>=0;
 var h='<div class="verdict '+(ok?'v-ok':'v-out')+'"><div class="vt">Pathway complete</div><div class="vh">'+
  ({discharge:'Discharge',admit:'Admit',transfer:'Transfer','admit-ne':'Admit',"admit-ich":'Admit','transfer-ich':'Transfer','non-stroke':'Non-stroke etiology'}[d]||'Summary')+
  '</div><div class="vw">Everything captured on the pathway, in one block for the note.</div></div>';
 h+='<div class="card"><div class="lbl" style="margin-top:0">Encounter summary</div><div class="sumbox" id="sumbox">'+
  sumText().replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</div>'+
  '<div class="nav"><button class="btn btn-s" onclick="back()">&larr; Back</button><button class="btn btn-p" onclick="copySum(this)">Copy summary</button></div></div>';
 h+='<div class="card"><div class="lbl" style="margin-top:0">Epic items used on this patient</div><div class="sub" style="margin-bottom:8px">These are the links the build team would need to wire.</div>'+epicUsed()+
  '<div class="nav"><button class="btn btn-p" onclick="restart()">Start a new patient</button></div></div>';
 return h;
};
function epicUsed(){
 var l=[];
 var r=S.lastVerdict||route();
 if(r==='CODE'){l.push('Code Stroke Order Set');l.push(ctaOrder()?'CT / CTA (Code Stroke) with perfusion':'CT (Code Stroke) Head w/o');l.push('Telestroke / Neuro consult');}
 if(r==='NE'||S.dispo==='admit-ne')l.push('Non-Emergent Stroke Orders (imaging, labs, patient care)');
 if(S.lyticsGiven||S.extGiven)l.push('Code Stroke Tenecteplase Orders');
 if(S.mtDone)l.push('Mechanical Thrombectomy — Order Here');
 if(S.ct==='hemorrhagic')l.push('Intracerebral Hemorrhage Order Set');
 if(S.dispo==='non-stroke')l.push('Dispo &mdash; non-stroke etiology');
 if(S.dispo)l.push('Dispo — '+(S.dispo.indexOf('transfer')>=0?'Transfer + stroke centre list':S.dispo==='discharge'?'Discharge':'Admit'));
 if(!l.length)return '<div class="note">None reached on this path.</div>';
 return l.map(function(n){return '<span class="lk lk-epic">'+n+'</span>';}).join('');
}
function copySum(b){
 var t=sumText();
 function done(){b.textContent='Copied';setTimeout(function(){b.textContent='Copy summary';},1600);}
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,fallback);}else fallback();
 function fallback(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');done();}catch(e){}a.remove();}
}

/* ============ RENDER ============ */
function render(){
 document.getElementById('strip').innerHTML=strip();
 document.getElementById('main').innerHTML=(V[step]||V.intro)();
 tick();
}
restart();
ticker=setInterval(tick,20000);
</script>
</body>
